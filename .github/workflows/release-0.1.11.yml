name: Publish 0.1.11
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release-0.1.11.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: release-v0.1.11
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: 7835f6a3a2ceb4859d6e6e72d089465d78d69c03
      BUILD_RUN: '34698158760'
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested build
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > /tmp/build-run.json
          jq -e --arg commit "$RELEASE_COMMIT" '.head_sha == $commit and .conclusion == "success" and .event == "push"' /tmp/build-run.json
          gh run download "$BUILD_RUN" --name ai-block-bridge-26.2 --dir release-assets
      - name: Verify and prepare install JAR
        run: |
          python3 - <<'PY'
          import json, pathlib, zipfile, hashlib, shutil
          folder = pathlib.Path('release-assets')
          jar = folder / 'ai-block-bridge-0.1.11.jar'
          assert jar.is_file(), 'Expected install JAR is missing'
          with zipfile.ZipFile(jar) as archive:
              metadata = json.loads(archive.read('fabric.mod.json'))
              assert metadata['id'] == 'ai_block_bridge' and metadata['version'] == '0.1.11'
              assert metadata['depends']['minecraft'] == '~26.2'
              assert metadata['license'] == 'MIT'
              for notice in ['LICENSE', 'NOTICE', 'licenses/CC0-1.0.txt']:
                  assert archive.read(notice) == pathlib.Path(notice).read_bytes()
              assert metadata['icon'] in archive.namelist()
              assert metadata['contact']['homepage'] == 'https://discord.gg/95secUdgMK'
              for language, label in [('ko_kr', '디스코드 서버'), ('en_us', 'Discord Server')]:
                  text = json.loads(archive.read(f'assets/ai_block_bridge/lang/{language}.json'))
                  assert text['ai_block_bridge.modmenu.discord'] == label
          for source in folder.glob('*-sources.jar'):
              with zipfile.ZipFile(source) as archive:
                  for notice in ['LICENSE', 'NOTICE', 'licenses/CC0-1.0.txt']:
                      assert archive.read(notice) == pathlib.Path(notice).read_bytes()
              source.unlink()
          shutil.copyfile('docs/releases/v0.1.11.md', folder / 'INSTALL-AND-GUIDE.md')
          shutil.copyfile('LICENSE', folder / 'LICENSE.txt')
          shutil.copyfile('NOTICE', folder / 'NOTICE.txt')
          (folder / 'SHA256SUMS.txt').write_text(hashlib.sha256(jar.read_bytes()).hexdigest() + '  ' + jar.name + '\n')
          PY
      - name: Create draft and publish complete release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.11 --json isDraft > /tmp/release.json 2>/dev/null; then
            if jq -e '.isDraft == false' /tmp/release.json >/dev/null; then
              echo 'Release already published; leaving it unchanged.'
              exit 0
            fi
          else
            gh release create v0.1.11 --target "$RELEASE_COMMIT" --draft --title 'AI Block Bridge 0.1.11 · Minecraft 26.2 / Fabric' --notes-file docs/releases/v0.1.11.md
          fi
          gh release upload v0.1.11 release-assets/ai-block-bridge-0.1.11.jar release-assets/INSTALL-AND-GUIDE.md release-assets/SHA256SUMS.txt release-assets/LICENSE.txt release-assets/NOTICE.txt --clobber
          gh release edit v0.1.11 --draft=false --latest --notes-file docs/releases/v0.1.11.md
