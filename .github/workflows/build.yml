name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Inspect API
        run: bash gradlew inspectApi --console=plain
      - name: Test and build
        run: bash gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ai-block-bridge-26.2
          path: build/libs/ai-block-bridge-*.jar
          if-no-files-found: error
