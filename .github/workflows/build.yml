name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Inspect rendering API
        run: bash gradlew inspectApi --console=plain
      - name: Test and build
        run: bash gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ai-block-bridge-26.2
          path: build/libs/ai-block-bridge-*.jar
          if-no-files-found: error
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/test-results/
            build/reports/
            build/gametest-results.xml
          if-no-files-found: ignore
