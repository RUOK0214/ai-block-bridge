plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
base { archivesName = 'ai-block-bridge' }
loom {
    splitEnvironmentSourceSets()
    mods { "ai_block_bridge" { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    from(rootProject.projectDir) { include 'LICENSE', 'NOTICE', 'licenses/CC0-1.0.txt' }
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(['version': project.version]) { escapeBackslash = true }
    }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
test { useJUnitPlatform() }
tasks.register('inspectApi') {
    doLast {
        println providers.exec {
            commandLine 'javap', '-classpath', sourceSets.client.compileClasspath.asPath,
                providers.gradleProperty('inspectClass').get()
        }.standardOutput.asText.get()
    }
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'ai_block_bridge_test'
        enableGameTests = true
        enableClientGameTests = true
    }
}

// Include the same licensing notices with source distributions.
tasks.named('sourcesJar') {
    from(rootProject.projectDir) { include 'LICENSE', 'NOTICE', 'licenses/CC0-1.0.txt' }
}
