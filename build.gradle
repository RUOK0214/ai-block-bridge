plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
base { archivesName = 'ai-block-bridge' }
loom {
    splitEnvironmentSourceSets()
    mods { "ai_block_bridge" { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
test { useJUnitPlatform() }
tasks.register('inspectApi') {
    doLast {
        def cp = sourceSets.client.compileClasspath.asPath
        ['net.minecraft.world.level.block.entity.BlockEntity', 'net.minecraft.client.gui.components.MultiLineEditBox$Builder',
         'net.minecraft.client.gui.components.EditBox', 'net.minecraft.client.Minecraft',
         'net.minecraft.client.input.KeyEvent', 'net.minecraft.client.input.CharacterEvent',
         'net.minecraft.client.KeyboardHandler', 'net.minecraft.commands.arguments.blocks.BlockStateParser'].each { cls ->
            println providers.exec { commandLine 'javap', '-classpath', cp, cls }.standardOutput.asText.get()
        }
    }
}
